name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tabletrail
      AUTH_PROVIDER: none
      ENABLE_DEV_AUTH: "false"
      ORDER_STORE: memory
      PAYMENT_PROVIDER: test
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tabletrail
          POSTGRES_USER: tabletrail
          POSTGRES_PASSWORD: tabletrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabletrail -d tabletrail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tabletrail:tabletrail@localhost:5432/tabletrail
      REDIS_URL: redis://localhost:6379
      AUTH_PROVIDER: postgres
      ORDER_STORE: postgres
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply migrations
        run: npm run db:migrate:deploy
      - name: Run PostgreSQL and Redis integration tests
        run: npm run test:integration
