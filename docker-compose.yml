services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tabletrail
      POSTGRES_USER: tabletrail
      POSTGRES_PASSWORD: tabletrail_dev
    ports:
      - "5432:5432"
    volumes:
      - tabletrail-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabletrail -d tabletrail"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - tabletrail-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tabletrail:tabletrail_dev@postgres:5432/tabletrail
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYMENT_PROVIDER: test
      MAPS_PROVIDER: mock
      EMAIL_PROVIDER: log
      SESSION_SECRET: local-compose-session-secret-change-me
      ORDER_STORE: postgres
      AUTH_PROVIDER: postgres
      PARTNER_PORTAL: postgres
      ADMIN_PHONE: ""
      METRICS_TOKEN: local-compose-metrics-token
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  tabletrail-postgres:
  tabletrail-redis:
